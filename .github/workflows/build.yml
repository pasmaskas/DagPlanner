name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip uitpakken
        run: |
          ZIP=$(ls *.zip | head -n1)
          unzip -oq "$ZIP" -d app
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Installeren
        working-directory: app
        run: npm install && npx cap add android
      - name: Permissies
        working-directory: app
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Vaste handtekening en versienummer
        working-directory: app
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: APK bouwen
        working-directory: app
        run: npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dagplanner-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
